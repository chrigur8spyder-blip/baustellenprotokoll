name: Hofzeit (Uhr- und Handy-App)

on:
  push:
    paths:
      - 'hofzeit/**'
      - '.github/workflows/hofzeit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hofzeit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hofzeit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und Apps bauen
        run: ./gradlew --no-daemon --stacktrace :core:test :wear:assembleRelease :mobile:assembleRelease

      - name: Bildschirmfotos erzeugen
        id: shots
        continue-on-error: true
        run: ./gradlew --no-daemon :wear:recordPaparazziDebug :mobile:recordPaparazziDebug

      - name: Dateien einsammeln
        run: |
          mkdir -p out/bilder
          cp wear/build/outputs/apk/release/wear-release.apk out/Hofzeit-Uhr.apk
          cp mobile/build/outputs/apk/release/mobile-release.apk out/Hofzeit-Handy.apk
          find wear/src/test/snapshots mobile/src/test/snapshots -name '*.png' -exec cp {} out/bilder/ \; 2>/dev/null || true
          (cd out && zip -qr Hofzeit-Bilder.zip bilder) || true
          ls -la out out/bilder

      - uses: actions/upload-artifact@v4
        with:
          name: hofzeit
          path: |
            hofzeit/out/*.apk
            hofzeit/out/Hofzeit-Bilder.zip

      - name: Download-Seite aktualisieren (Release «hofzeit-neueste»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hofzeit-neueste --yes --cleanup-tag || true
          files="out/Hofzeit-Uhr.apk out/Hofzeit-Handy.apk"
          [ -f out/Hofzeit-Bilder.zip ] && files="$files out/Hofzeit-Bilder.zip"
          gh release create hofzeit-neueste $files \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Hofzeit – neueste Version (Build ${GITHUB_RUN_NUMBER})" \
            --notes "Hofzeit-Uhr.apk auf die Galaxy Watch, Hofzeit-Handy.apk aufs Handy. Anleitung: hofzeit/README.md"
